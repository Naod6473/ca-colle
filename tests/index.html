<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Banc de test · Ça colle ?</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  :root { --paper: #fdf3e3; --ink: #17141f; --ok: #d9f7e6; --no: #ffe0ea; }
  body { margin: 0; padding: 24px 16px 60px; font: 15px/1.5 "Figtree", system-ui, sans-serif; color: var(--ink); background: var(--paper); }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font: italic 900 clamp(28px, 6vw, 44px)/1 "Archivo", sans-serif; text-transform: uppercase; margin: 0 0 8px; }
  .lang { display: flex; gap: 8px; margin: 12px 0 20px; }
  .lang a { padding: 6px 12px; border: 2px solid var(--ink); background: #fff; color: inherit; text-decoration: none; font-weight: 800; }
  .lang a[aria-current] { background: #ffd93d; }
  .total { padding: 12px 16px; border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); font-weight: 800; margin-bottom: 18px; }
  details { border: 2.5px solid var(--ink); background: #fff; margin-bottom: 10px; }
  details.pass summary { background: var(--ok); }
  details.fail summary { background: var(--no); }
  summary { padding: 10px 14px; cursor: pointer; font-weight: 800; }
  .body { padding: 10px 14px; overflow-x: auto; }
  .fails { color: #b0203f; font-weight: 700; margin: 0 0 8px; padding-left: 20px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td { border-top: 1px solid #ddd; padding: 4px 6px; vertical-align: top; }
  td:first-child { width: 4em; font-weight: 800; }
  small { color: #555; }
</style>
</head>
<body>
<main>
  <h1>Banc de test</h1>
  <p>Des offres et des CV fictifs, avec ce que l'analyse doit trouver. Page cachée, non reliée à l'app.</p>
  <nav class="lang"><a href="./">Français</a><a href="./?lang=en">English</a></nav>
  <div id="out"></div>
</main>
<script>
  var CACOLLE_LANG = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";
  document.querySelectorAll(".lang a")[CACOLLE_LANG === "en" ? 1 : 0].setAttribute("aria-current", "page");
</script>
<script src="../js/lang.js"></script>
<script src="../js/moteur.js"></script>
<script src="cas.js"></script>
<script src="bench.js"></script>
<script>
  const res = runCases(CASES), bad = res.filter(r => r.fails.length).length;
  document.getElementById("out").innerHTML = `<p class="total">${bad ? `✕ ${bad} cas en échec sur ${res.length}` : `✓ Les ${res.length} cas passent`}</p>` +
    res.map(r => `<details class="${r.fails.length ? "fail" : "pass"}"${r.fails.length ? " open" : ""}><summary>${r.fails.length ? "✕" : "✓"} ${esc(r.name)} · ${r.points} points · ${r.score} %</summary><div class="body">
      ${r.fails.length ? `<ul class="fails">${r.fails.map(f => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      <table>${r.rs.map(x => `<tr><td>${LABEL[x.st]}</td><td>${esc(x.k)}${x.proof ? `<br><small>« ${esc(x.proof.t.slice(0, 110))} »</small>` : ""}</td></tr>`).join("")}</table></div></details>`).join("");
</script>
</body>
</html>
